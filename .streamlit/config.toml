[theme]
base = "dark"
primaryColor = "#FF6B00"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"
textColor = "#F0F0F0"
borderColor = "#262626"
showWidgetBorder = true
baseRadius = "8px"
font = "sans-serif"
codeFont = "monospace"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
